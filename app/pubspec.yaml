name: fitmakyp
description: "FitMakyp - Tu entrenamiento, tu progreso, tu evolución."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.2
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
    - assets/exercises/frames/
    - assets/sounds/
    - assets/warmup/
